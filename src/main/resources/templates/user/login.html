<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Requiem - 로그인</title>
    <link rel="icon" th:href="@{/file/logo/favicon.png}">
    <link rel="stylesheet" th:href="@{/css/commons.css}">
    <link rel="stylesheet" th:href="@{/css/user.css}">
    <script th:src="@{/js/commons.js}"></script>
    <script th:src="@{/js/user.js}"></script>
</head>
<body>
    <header th:replace="commons :: header"></header>

    <section class="userSection">
        <form class="userForm" id="loginForm">
            <h1 class="loginFormHeader title1Text">LOG IN</h1>
            <div class="inputsWrap">
                <input type="text" id="idInput" placeholder="ID">
                <input type="password" id="pwInput" placeholder="PW">
                <button class="btn purple" type="button" onclick="login()">로그인</button>
            </div>
            <a class="text2 ton3 center joinLink" th:href="@{/join}">회원가입</a>
        </form>
    </section>

    <nav th:replace="commons :: nav"></nav>

    <footer th:replace="commons :: footer"></footer>

    <div th:replace="commons :: toast"></div>
</body>
</html>
